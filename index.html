<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111114">
  <title>MINGREN — Born from Darkness</title>
  <style>
    :root { color-scheme: dark; --bg:#111114; --panel:#1b1b20; --red:#b51f2a; --red2:#e23a46; --text:#f6f2f2; --muted:#bcb5bb; --line:#393238; }
    * { box-sizing:border-box; }
    body { margin:0; background:radial-gradient(circle at 50% 0%, #3a1018 0, var(--bg) 38rem); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; min-height:100vh; }
    a { color:inherit; text-decoration:none; }
    .wrap { width:min(100% - 28px, 760px); margin:0 auto; padding:26px 0 38px; }
    .topline { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; color:var(--muted); font-size:.78rem; letter-spacing:.16em; text-transform:uppercase; }
    .dot { display:inline-block; width:8px; height:8px; background:var(--red2); border-radius:50%; margin-right:8px; box-shadow:0 0 14px var(--red2); }
    .hero { overflow:hidden; border:1px solid #5a3038; border-radius:24px; background:linear-gradient(145deg,rgba(181,31,42,.2),rgba(27,27,32,.96) 55%); padding:30px 22px 26px; text-align:center; box-shadow:0 18px 55px #0008; position:relative; }
    .hero:before { content:""; position:absolute; width:230px; height:230px; border:1px solid #a52a3b55; border-radius:50%; left:50%; top:-130px; transform:translateX(-50%); pointer-events:none; }
    .avatar { width:124px; height:124px; margin:0 auto 20px; border-radius:50%; display:grid; place-items:center; border:3px solid #a82b38; background:linear-gradient(135deg,#50141d,#17171b 60%,#76202a); box-shadow:0 0 0 6px #ffffff08,0 0 35px #b51f2a44; color:#fff; font-weight:900; font-size:2.2rem; letter-spacing:-.08em; }
    .avatar img { width:100%; height:100%; display:block; object-fit:cover; border-radius:50%; }
    h1 { margin:0; font-size:clamp(2.2rem,9vw,4.3rem); line-height:1; letter-spacing:.08em; }
    .tag { margin:14px auto 0; max-width:34rem; color:#eee3e5; font-size:1rem; line-height:1.7; }
    .subtag { margin:8px 0 0; color:var(--muted); font-size:.86rem; letter-spacing:.06em; }
    .socials { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:22px; }
    .socials a { border:1px solid #ffffff24; background:#ffffff0a; border-radius:999px; padding:9px 13px; font-size:.88rem; }
    .section-label { color:#d7a4aa; font-size:.75rem; letter-spacing:.18em; text-transform:uppercase; margin:28px 4px 12px; }
    .links { display:grid; gap:13px; }
    .link-card { display:flex; align-items:center; gap:15px; padding:18px; border:1px solid #51242b; border-radius:18px; background:linear-gradient(110deg,#28161b,#1b1b20 72%); transition:transform .18s,border-color .18s; }
    .link-card:hover,.link-card:focus-visible { transform:translateY(-2px); border-color:var(--red2); outline:none; }
    .icon { flex:0 0 46px; height:46px; display:grid; place-items:center; border-radius:14px; background:var(--red); color:#fff; font-weight:800; font-size:1.1rem; }
    .link-copy { flex:1; min-width:0; }
    .link-copy strong { display:block; font-size:1rem; letter-spacing:.02em; }
    .link-copy span { display:block; color:var(--muted); font-size:.83rem; margin-top:4px; }
    .arrow { color:#e7a5ab; font-size:1.4rem; }
    .note { margin-top:22px; padding:15px 16px; border-left:3px solid var(--red); background:#ffffff06; color:var(--muted); font-size:.85rem; line-height:1.6; border-radius:0 12px 12px 0; }
    footer { text-align:center; margin-top:25px; color:#81777d; font-size:.76rem; letter-spacing:.08em; }
    @media(min-width:600px) { .wrap{padding-top:42px}.hero{padding:42px 34px 32px}.links{grid-template-columns:1fr}.link-card{padding:20px} }
    @media(prefers-reduced-motion:reduce) { *,*:before,*:after{transition:none!important;scroll-behavior:auto!important} }
  </style>
</head>
